<!doctype html>
<html lang="cs" data-phase="day">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <button class="icon-btn" id="openSettings" type="button" aria-label="Nastavení" title="Nastavení"></button>
    </div>

    <main class="layout">
      <div class="col">
        <header class="hero" aria-label="Čas a datum">
          <p class="greeting" id="greeting"></p>
          <div class="clock"><span id="hm">--:--</span><span class="sec" id="sec">--</span></div>
          <p class="date" id="date"></p>
        </header>

        <section class="links" aria-labelledby="linksTitle">
          <h2 id="linksTitle">Rychlé odkazy</h2>
          <div class="tiles" id="tiles"></div>
          <button class="menu-btn" id="openMenu" type="button">
            <span class="ico" id="gridIco"></span>
            <span>Všechny odkazy</span>
            <span class="count" id="linkCount"></span>
            <kbd title="Klávesová zkratka">/</kbd>
          </button>
        </section>
      </div>

      <div class="col">
        <section class="weather" id="weather" aria-label="Počasí">
          <p class="w-msg">Načítám počasí…</p>
        </section>

        <section class="agenda" aria-labelledby="agendaTitle">
          <div class="agenda-head">
            <h2 id="agendaTitle">Kalendář</h2>
            <p class="next-up" id="nextUp"></p>
          </div>
          <div id="agendaBody"></div>
        </section>
      </div>
    </main>
  </div>

  <div class="sheet" id="menu" role="dialog" aria-modal="true" aria-label="Všechny odkazy" inert>
    <div class="sheet-inner">
      <div class="sheet-top">
        <input class="search" id="search" type="search" placeholder="Hledat odkaz" autocomplete="off" aria-label="Hledat odkaz">
        <button class="icon-btn" id="closeMenu" type="button" aria-label="Zavřít menu"></button>
      </div>
      <div class="groups" id="groups"></div>
      <p class="empty" id="noResults" hidden>Nic nenalezeno. Zkus jiné slovo.</p>
    </div>
  </div>

  <div class="modal" id="settings" role="dialog" aria-modal="true" aria-labelledby="setTitle" inert>
    <form class="modal-card" id="setForm">
      <h2 id="setTitle">Nastavení</h2>

      <label class="field">
        <span>Kalendáře z iCloudu</span>
        <textarea id="setCals" rows="3" placeholder="webcal://p12-caldav.icloud.com/published/2/…"></textarea>
        <small>Jeden odkaz na řádek. V aplikaci Kalendář nebo na iCloud.com zapni u kalendáře Veřejný kalendář a zkopíruj odkaz.</small>
      </label>

      <label class="field">
        <span>Adresa proxy pro kalendář</span>
        <input id="setProxy" type="text" placeholder="https://tvuj-worker.workers.dev/?url=" autocomplete="off">
        <small>iCloud neumožňuje stáhnout kalendář přímo z webové stránky. Proxy odkaz předá dál. Adresa obvykle končí na ?url=</small>
      </label>

      <label class="check">
        <input type="checkbox" id="setAuto">
        <span>Zjistit polohu automaticky (prohlížeč se zeptá na povolení)</span>
      </label>

      <label class="field">
        <span>Město pro počasí</span>
        <input id="setCity" type="text" placeholder="např. Ostrava" autocomplete="off">
        <small>Použije se, když je automatická poloha vypnutá nebo ji prohlížeč nepovolí.</small>
      </label>

      <p class="form-msg" id="setMsg" role="status"></p>
      <div class="actions">
        <button type="button" class="btn" id="setCancel">Zrušit</button>
        <button type="submit" class="btn primary">Uložit</button>
      </div>
    </form>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
